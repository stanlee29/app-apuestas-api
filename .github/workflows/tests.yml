name: Validate AppApuestas

on:
  push:
    branches: [main]
    paths:
      - "AppApuestas/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "AppApuestas/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-apuestas-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Python and frontend validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AppApuestas
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: AppApuestas/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q .

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Check frontend JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/research-live.js
          node --check static/thesportsdb-research.js
          node --check static/nba-research.js
          node --check static/pro-sports-research.js
