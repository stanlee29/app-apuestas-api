name: Validate AppApuestas

on:
  push:
    branches: [main]
    paths:
      - "AppApuestas/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "AppApuestas/**"
      - ".github/workflows/tests.yml"

concurrency:
  group: app-apuestas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: AppApuestas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: AppApuestas/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check frontend JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/research-live.js
          node --check static/thesportsdb-research.js
          node --check static/nba-research.js
