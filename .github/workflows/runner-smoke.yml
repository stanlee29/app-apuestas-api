name: Temporary GitHub Actions runner diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runner-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-smoke:
    name: Minimal runner smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm runner allocation
        run: |
          echo "GitHub-hosted runner allocated successfully"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"
          python3 --version
